<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:#f4f6fa;color:#1b1b22;max-width:520px;margin:0 auto;padding-bottom:70px}
header{background:#0b2c4d;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header button{background:none;border:0;color:#fff;text-decoration:underline;font:inherit;cursor:pointer}
main{padding:12px}
.card{background:#fff;border:1px solid #e5e8ef;border-radius:16px;padding:14px;margin-bottom:12px}
.c{text-align:center}.m{color:#6b7280}.g{color:#15803d}.b{font-weight:700}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;border:1px solid #cfd5e0;border-radius:12px;font:16px 'Hind Siliguri',sans-serif;background:#fff}
.btn{background:#0b2c4d;color:#fff;border:0;border-radius:12px;padding:10px 16px;font:700 15px 'Hind Siliguri';cursor:pointer}
.btn2{background:#fff;color:#1b1b22;border:1px solid #cfd5e0;border-radius:12px;padding:10px 16px;font:600 15px 'Hind Siliguri';cursor:pointer}
.sm{padding:6px 12px;font-size:13px}.w{width:100%}.red{color:#b42318}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
.tab{flex:none;border:1px solid #cfd5e0;background:#fff;border-radius:99px;padding:6px 14px;font:600 13px 'Hind Siliguri';cursor:pointer}
.tab.on{background:#0b2c4d;color:#fff;border-color:#0b2c4d}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prod{display:flex;gap:12px}
.prod img,.ph{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#eef1f6;display:grid;place-items:center;font-size:30px;flex:none}
.pc .pr{display:flex;gap:12px}
.pc img,.pc .ph{width:120px;height:120px;border-radius:12px;object-fit:cover;background:#eef1f6;display:grid;place-items:center;font-size:40px;flex:none;cursor:zoom-in}
.pi{flex:1;min-width:0}
.pd{font-size:13px;color:#4b5563;margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;cursor:pointer}
.pd.open{display:block;-webkit-line-clamp:unset}
.zm{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}
.zm img{max-width:100%;max-height:100%;border-radius:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid2 .card{margin:0;text-align:center}
.warn{background:#fff7e0;color:#92400e}
#t{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
#t.s{opacity:1}
label{font-size:13px;color:#6b7280}
h2{font-size:17px;margin:4px 0 10px}
</style>

const logo=h=>`<img src="${ICON}" alt="" style="height:${h}px;width:${h}px;border-radius:50%;vertical-align:middle">`;
document.head.insertAdjacentHTML("beforeend",`<link rel="icon" href="${ICON}">`);
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tk=n=>"৳"+Number(n||0).toLocaleString("bn-BD");
const em=p=>p+"@reseller.trendygallery.app";
const ST={pending:"পেন্ডিং",confirmed:"কনফার্মড",delivered:"ডেলিভারড",cancelled:"বাতিল",approved:"অ্যাপ্রুভড",rejected:"রিজেক্টেড"};
const NV='if(!S.me.verified)';
let S={me:null,area:"inside",tab:"products",mode:"login",cart:{},q:"",d:{products:[],orders:[],wds:[],users:[],rp:{},bal:{total_income:0,pending:0,withdrawn:0}}};
let tt;function toast(m){const e=$("#t");e.textContent=m;e.className="s";clearTimeout(tt);tt=setTimeout(()=>e.className="",2600)}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
const needV=()=>{if(!S.me.verified){toast("ভেরিফাই হওয়ার পর এটি করতে পারবেন");return true}return false};
function render(){const y=scrollY;const a=$("#app");
 a.innerHTML=!S.me?authV():S.me.role==="admin"?adminV():resV();scrollTo(0,y)}
function zoom(u){const d=document.createElement("div");d.className="zm";d.onclick=()=>d.remove();d.innerHTML=`<img src="${esc(u)}" alt="">`;document.body.appendChild(d)}
function setMode(m){S.mode=m;render()}
function setTab(t){S.tab=t;render();scrollTo(0,0)}

/* ---------- auth ---------- */
function authV(){const su=S.mode==="signup";
 return `<main><div class="card c" style="margin-top:30px"><img src="${LOGO}" alt="Trendy Gallery" style="width:220px;max-width:75%;border-radius:18px"><p class="m">রিসেলার পোর্টাল</p></div>
 <div class="card">${su?'<input id="nm" placeholder="আপনার নাম">':''}
 <input id="ph" inputmode="numeric" maxlength="11" placeholder="মোবাইল নম্বর">
 <input id="pw" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)">
 <button class="btn w" onclick="submitAuth()">${su?"অ্যাকাউন্ট তৈরি করুন":"লগইন"}</button>
 <button class="btn2 w" style="margin-top:10px" onclick="setMode('${su?"login":"signup"}')">${su?"অ্যাকাউন্ট আছে? লগইন":"নতুন? অ্যাকাউন্ট তৈরি করুন"}</button>${su?"":`<a class="m" target="_blank" style="display:block;text-align:center;margin-top:14px" href="https://wa.me/${WA}?text=${encodeURIComponent("আমি পাসওয়ার্ড ভুলে গেছি। আমার মোবাইল নম্বর: ")}">পাসওয়ার্ড ভুলে গেছেন? WhatsApp-এ জানান</a>`}</div></main>`}
async function submitAuth(){const su=S.mode==="signup",n=val("nm"),ph=val("ph"),pw=$("#pw").value;
 if(su&&!n)return toast("নাম লিখুন");
 if(!/^01\d{9}$/.test(ph))return toast("সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)");
 if(pw.length<6)return toast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর");
 const r=su?await sb.auth.signUp({email:em(ph),password:pw,options:{data:{name:n,phone:ph}}}):await sb.auth.signInWithPassword({email:em(ph),password:pw});
 if(r.error)return toast(su?"অ্যাকাউন্ট তৈরি হয়নি: "+r.error.message:"নম্বর বা পাসওয়ার্ড ভুল");
 loadMe()}
async function logout(){await sb.auth.signOut();S.me=null;S.cart={};render()}
async function loadMe(){const {data:{user}}=await sb.auth.getUser();
 if(!user){S.me=null;return render()}
 const {data:p}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(!p){await sb.auth.signOut();S.me=null;return render()}
 S.me=p;await loadData();render()}
async function loadData(){const d=S.d;
 if(S.me.role==="admin"){
  const [a,b,c,e]=await Promise.all([sb.from("products").select("*").order("id",{ascending:false}),sb.from("profiles").select("*").eq("role","reseller").order("created_at",{ascending:false}),sb.from("orders").select("*, profiles(name, phone)").order("id",{ascending:false}),sb.from("withdrawals").select("*, profiles(name, phone)").order("id",{ascending:false})]);
  d.products=a.data||[];d.users=b.data||[];d.orders=c.data||[];d.wds=e.data||[];S.tab=S.tab==="products"||["users","orders","wds"].includes(S.tab)?S.tab:"products";
 }else{
  /* ভেরিফাইড না হলে প্রাইসবিহীন ভিউ থেকে পণ্য আসবে */
  const [a,b,c,e,f]=await Promise.all([sb.from(S.me.verified?"products":"products_public").select("*").eq("active",true).order("id",{ascending:false}),sb.from("orders").select("*").order("id",{ascending:false}),sb.from("withdrawals").select("*").order("id",{ascending:false}),sb.from("reseller_balances").select("*").eq("id",S.me.id).single(),sb.from("reseller_prices").select("*")]);
  d.products=a.data||[];d.orders=b.data||[];d.wds=c.data||[];if(e.data)d.bal=e.data;d.rp={};(f.data||[]).forEach(x=>{d.rp[x.product_id]=+x.price})}}
const tabsBar=(l)=>`<div class="tabs">${l.map(([k,t])=>`<button class="tab ${S.tab===k?"on":""}" onclick="setTab('${k}')">${t}</button>`).join("")}</div>`;
const hdr=t=>`<header><b>${logo(32)} Trendy Gallery</b><span style="font-size:13px;opacity:.8">${esc(t)}</span><button onclick="logout()">লগআউট</button></header>`;

/* ---------- reseller ---------- */
const pz=p=>Math.max(S.d.rp[p.id]!=null?S.d.rp[p.id]:p.reseller_price,p.admin_price);
function plist(){const q=S.q.toLowerCase(),v=S.me.verified;
 const l=S.d.products.filter(p=>(p.name+(p.category||"")).toLowerCase().includes(q));
 if(!l.length)return `<p class="c m">কোনো পণ্য নেই</p>`;
 return l.map(p=>`<div class="card pc"><div class="pr">${p.image_url?`<img src="${esc(p.image_url)}" alt="" onclick="zoom(this.src)">`:'<div class="ph">🛍️</div>'}
 <div class="pi"><b>${esc(p.name)}</b>${v?`<div class="b" style="font-size:14px;margin-top:2px">পাইকারি মূল্য ${tk(p.admin_price)}</div>`:""}${p.description?`<div class="pd" onclick="this.classList.toggle('open')">${esc(p.description)}</div>`:""}</div></div>
 ${v?`<label style="display:block;margin-top:10px">আমার বিক্রয় মূল্য ৳</label><div style="display:flex;gap:6px"><input id="sp${p.id}" type="number" value="${pz(p)}" style="margin:0"><button class="btn sm" onclick="savePrice(${p.id})">সেভ</button></div>
 <div class="g b" style="font-size:13px;margin-top:4px">লাভ ${tk(pz(p)-p.admin_price)}</div>
 <div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm" onclick="addCart(${p.id})">কার্টে যোগ</button><button class="btn2 sm" onclick="share(${p.id})">শেয়ার</button></div>`
 :`<div class="m" style="font-size:13px;margin-top:8px">🔒 পাইকারি রেট দেখতে ভেরিফাইড রিসেলার হতে হবে</div>`}</div>`).join("")}
async function savePrice(id){if(needV())return;const p=S.d.products.find(x=>x.id===id),v=+val("sp"+id);
 if(!(v>=p.admin_price))return toast("বিক্রয় মূল্য পাইকারি মূল্য ("+tk(p.admin_price)+") এর কম হতে পারবে না");
 const {error}=await sb.from("reseller_prices").upsert({reseller_id:S.me.id,product_id:id,price:v});
 if(error)return toast(error.message);S.d.rp[id]=v;toast("সেভ হয়েছে");render()}
function addCart(id){if(needV())return;S.cart[id]=(S.cart[id]||0)+1;toast("কার্টে যোগ হয়েছে");render()}
function chg(id,n){S.cart[id]=(S.cart[id]||0)+n;if(S.cart[id]<1)delete S.cart[id];render()}
async function share(id){if(needV())return;const p=S.d.products.find(x=>x.id===id);const text=p.name+" – "+tk(pz(p))+" | Trendy Gallery";
 try{if(navigator.share)await navigator.share({title:"Trendy Gallery",text});else{await navigator.clipboard.writeText(text);toast("কপি হয়েছে")}}catch(e){}}
async function order(){if(needV())return;const n=val("cn"),ph=val("cp"),ad=val("ca");
 if(!n||!/^01\d{9}$/.test(ph)||ad.length<5)return toast("কাস্টমারের নাম, সঠিক নম্বর ও ঠিকানা দিন");
 const items=Object.entries(S.cart).map(([id,qty])=>({id:+id,qty}));
 const {error}=await sb.rpc("place_order",{p_name:n,p_phone:ph,p_address:ad,p_area:S.area,p_items:items});
 if(error)return toast(error.message);
 S.cart={};toast("অর্ডার হয়েছে");await loadData();S.tab="orders";render()}
async function withdraw(){if(needV())return;const m=val("wm")||"bkash";const {error}=await sb.rpc("request_withdrawal_v2",{p_number:val("wb"),p_amount:+val("wa"),p_method:m});
 if(error)return toast(error.message);toast("আবেদন জমা হয়েছে");await loadData();render()}
function resV(){const {me,d}=S,bal=d.bal,avail=bal.total_income-bal.withdrawn;
 const ci=me.verified?d.products.filter(p=>S.cart[p.id]):[];
 const tot=ci.reduce((s,p)=>s+pz(p)*S.cart[p.id],0),prf=ci.reduce((s,p)=>s+(pz(p)-p.admin_price)*S.cart[p.id],0),dl=DEL[S.area];
 const ref=location.origin+location.pathname+"?ref="+me.code;let h="";
 if(S.tab==="products")h=`<input id="q" placeholder="পণ্য খুঁজুন..." value="${esc(S.q)}" oninput="S.q=this.value;$('#pl').innerHTML=plist()"><div id="pl">${plist()}</div>`;
 if(S.tab==="cart")h=!me.verified?`<p class="c m">ভেরিফাই হওয়ার পর কার্ট ব্যবহার করতে পারবেন</p>`:!ci.length?`<p class="c m">কার্ট খালি</p>`:ci.map(p=>`<div class="card row"><span>${esc(p.name)} × ${S.cart[p.id]}</span><span><button class="btn2 sm" onclick="chg(${p.id},1)">＋</button> <button class="btn2 sm" onclick="chg(${p.id},-1)">－</button></span></div>`).join("")+
  `<div class="card"><b>ডেলিভারি এলাকা</b><div style="display:flex;gap:8px;margin-top:8px"><button class="tab ${S.area==="inside"?"on":""}" onclick="S.area='inside';render()">ঢাকার ভিতরে ৳৭০</button><button class="tab ${S.area==="outside"?"on":""}" onclick="S.area='outside';render()">ঢাকার বাইরে ৳১২০</button></div></div>
  <div class="card"><div class="row"><span>পণ্যের মূল্য</span><b>${tk(tot)}</b></div><div class="row"><span>ডেলিভারি চার্জ</span><b>${tk(dl)}</b></div><div class="row" style="border-top:1px solid #e5e8ef;padding-top:8px;margin-top:8px"><span>কাস্টমারের কাছ থেকে নিন</span><b>${tk(tot+dl)}</b></div><div class="row g"><span>আপনার লাভ</span><b>${tk(prf)}</b></div></div>
  <div class="card"><b>কাস্টমারের তথ্য</b><input id="cn" style="margin-top:8px" placeholder="নাম"><input id="cp" inputmode="numeric" maxlength="11" placeholder="মোবাইল নম্বর"><textarea id="ca" rows="2" placeholder="পূর্ণ ঠিকানা"></textarea><button class="btn w" onclick="order()">অর্ডার কনফার্ম করুন</button></div>`;
 if(S.tab==="orders")h=!d.orders.length?`<p class="c m">এখনো কোনো অর্ডার নেই</p>`:d.orders.map(o=>`<div class="card"><div class="row"><small>#${o.id}</small><b>${ST[o.status]}</b></div><div>${o.items.map(i=>esc(i.name)+" ×"+i.qty).join(", ")}</div><small class="m">${esc(o.customer_name)} · ${esc(o.customer_phone)}</small><div style="font-size:14px">মোট ${tk(o.total)} (ডেলিভারি ${tk(o.delivery_charge)}) · আপনার লাভ <b class="g">${tk(o.commission)}</b></div></div>`).join("");
 if(S.tab==="wallet")h=`<div class="card c"><small class="m">অ্যাভেইলেবল ব্যালেন্স</small><div style="font-size:30px" class="b">${tk(avail)}</div></div>
  <div class="grid2"><div class="card"><small>মোট ইনকাম</small><div class="b">${tk(bal.total_income)}</div></div><div class="card"><small>পেন্ডিং কমিশন</small><div class="b">${tk(bal.pending)}</div></div></div>
  <div class="card"><b>টাকা উত্তোলন (চার্জ ৫ টাকা)</b><select id="wm" style="margin-top:8px"><option value="bkash">বিকাশ</option><option value="nagad">নগদ</option></select><input id="wb" inputmode="numeric" maxlength="11" placeholder="বিকাশ / নগদ নম্বর"><input id="wa" type="number" placeholder="পরিমাণ (সর্বনিম্ন ১০০)"><button class="btn w" onclick="withdraw()">আবেদন করুন</button></div>
  <h2>উত্তোলনের হিস্ট্রি</h2>`+d.wds.map(w=>`<div class="card row"><span>#${w.id} · ${w.method==="nagad"?"নগদ":"বিকাশ"} ${esc(w.bkash)}<br><small class="m">${new Date(w.created_at).toLocaleDateString("bn-BD")}</small></span><span style="text-align:right"><b>${tk(w.amount)}</b><br><small>${ST[w.status]} · চার্জ ${tk(w.charge)}</small></span></div>`).join("");
 if(S.tab==="profile")h=`<div class="card c"><div style="display:flex;justify-content:center">${avh(me.avatar_url,me.name,96)}</div><label class="btn2" style="display:inline-block;margin-top:10px;cursor:pointer">ছবি দিন / বদলান<input type="file" accept="image/*" style="display:none" onchange="pickPhoto(this)"></label></div><div class="card"><div class="row"><b style="font-size:20px">${esc(me.name)}</b><b class="${me.verified?"g":""}">${me.verified?"✔ Verified Seller":"পেন্ডিং"}</b></div>
  <p style="margin-top:10px">রিসেলার আইডি: <b>${esc(me.code)}</b></p><p>মোবাইল: <b>${esc(me.phone)}</b></p><p style="margin-top:10px">রেফারাল লিংক</p>
  <input readonly value="${esc(ref)}" onfocus="this.select()"><button class="btn2 w" onclick="navigator.clipboard.writeText('${esc(ref)}').then(()=>toast('কপি হয়েছে'))">লিংক কপি করুন</button></div><div class="card"><b>পাসওয়ার্ড বদলান</b><input id="npw" type="password" style="margin-top:8px" placeholder="নতুন পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><button class="btn w" onclick="changePw()">পাসওয়ার্ড বদলান</button></div>`;
 return hdr(me.name)+tabsBar([["products","পণ্য"],["cart","কার্ট ("+ci.length+")"],["orders","অর্ডার"],["wallet","ওয়ালেট"],["profile","প্রোফাইল"]])+
  `<main>${me.verified?"":'<div class="card warn">আপনার অ্যাকাউন্ট ভেরিফাই হওয়ার অপেক্ষায় আছে। ভেরিফাই না হওয়া পর্যন্ত পাইকারি রেট দেখা, অর্ডার ও উত্তোলন করা যাবে না।</div>'}${h}</main>`}

const avh=(u,n,sz)=>u?`<img src="${esc(u)}" alt="" style="width:${sz}px;height:${sz}px;border-radius:50%;object-fit:cover;flex:none">`:`<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:#0b2c4d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${sz*0.42}px;flex:none">${esc((n||"?").trim().charAt(0).toUpperCase())}</div>`;
function pickPhoto(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=async()=>{const c=document.createElement("canvas"),z=256,m=Math.min(im.width,im.height);c.width=c.height=z;c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);const url=c.toDataURL("image/jpeg",0.8);const {error}=await sb.rpc("set_my_avatar",{p_url:url});if(error)return toast(error.message);S.me.avatar_url=url;toast("ছবি সেভ হয়েছে");render()};im.onerror=()=>toast("ছবি পড়া যায়নি");im.src=r.result};r.readAsDataURL(f)}
async function changePw(){const pw=$("#npw").value;if(pw.length<6)return toast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর");
 const {error}=await sb.auth.updateUser({password:pw});toast(error?error.message:"পাসওয়ার্ড বদলানো হয়েছে");if(!error)$("#npw").value=""}
async function resetPw(phone){const pw=prompt("নতুন পাসওয়ার্ড দিন (কমপক্ষে ৬ অক্ষর):");if(!pw)return;if(pw.length<6)return toast("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর");
 const {error}=await sb.rpc("admin_reset_password",{p_phone:phone,p_new:pw});toast(error?error.message:"পাসওয়ার্ড বদলানো হয়েছে, রিসেলারকে জানান")}
/* ---------- admin ---------- */
async function addProduct(){const n=val("np_n"),c=val("np_c"),a=+val("np_a"),r=+val("np_r"),f=$("#np_f").files[0];
 if(!n||!(a>0)||r<a)return toast("নাম ও সঠিক দাম দিন (রিসেলার প্রাইস ≥ পাইকারি মূল্য)");
 let url=null;
 if(f){const path=Date.now()+"-"+f.name.replace(/[^\w.]/g,"_");const up=await sb.storage.from("products").upload(path,f);
  if(up.error)return toast(up.error.message);url=sb.storage.from("products").getPublicUrl(path).data.publicUrl}
 const {error}=await sb.from("products").insert({name:n,category:c||"ফ্যাশন",admin_price:a,reseller_price:r,image_url:url,description:val("np_d")});
 if(error)return toast(error.message);toast("পণ্য যোগ হয়েছে");await loadData();render()}
async function saveP(id){const a=+val("ap"+id),r=+val("rp"+id);
 if(!(a>0)||r<a)return toast("রিসেলার প্রাইস পাইকারি মূল্যের কম হতে পারবে না");
 const {error}=await sb.from("products").update({admin_price:a,reseller_price:r,description:val("dp"+id)}).eq("id",id);toast(error?error.message:"সেভ হয়েছে");await loadData();render()}
async function togP(id,v){await sb.from("products").update({active:!v}).eq("id",id);await loadData();render()}
async function delP(id){if(!confirm("ডিলিট করবেন?"))return;const {error}=await sb.from("products").delete().eq("id",id);if(error)toast('অর্ডারে ব্যবহৃত পণ্য ডিলিট না করে "বন্ধ" করুন');await loadData();render()}
async function upd(t,id,patch){const {error}=await sb.from(t).update(patch).eq("id",id);if(error)toast(error.message);await loadData();render()}
function adminV(){const d=S.d;let h="";
 if(S.tab==="products")h=`<div class="card"><b>নতুন পণ্য</b><input id="np_n" style="margin-top:8px" placeholder="নাম"><input id="np_c" placeholder="ক্যাটাগরি (যেমন: ফ্যাশন, গ্যাজেট)"><textarea id="np_d" rows="3" placeholder="পণ্যের বিবরণ (৩-৪ লাইন)"></textarea>
  <div class="row" style="gap:8px"><input id="np_a" type="number" placeholder="পাইকারি মূল্য"><input id="np_r" type="number" placeholder="সাজেস্টেড বিক্রয় মূল্য"></div><input id="np_f" type="file" accept="image/*"><button class="btn w" onclick="addProduct()">পণ্য যোগ করুন</button></div>`+
  d.products.map(p=>`<div class="card" style="${p.active?"":"opacity:.6"}"><div class="prod" style="gap:10px">${p.image_url?`<img src="${esc(p.image_url)}" alt="" style="width:50px;height:50px">`:""}<div><b>${esc(p.name)}</b><div class="m" style="font-size:13px">${esc(p.category)}</div></div></div>
  <textarea id="dp${p.id}" rows="3" style="margin-top:10px" placeholder="পণ্যের বিবরণ">${esc(p.description||"")}</textarea><div class="row" style="gap:8px;margin-top:0"><div style="flex:1"><label>পাইকারি মূল্য ৳</label><input id="ap${p.id}" type="number" value="${p.admin_price}"></div><div style="flex:1"><label>সাজেস্টেড বিক্রয় মূল্য ৳</label><input id="rp${p.id}" type="number" value="${p.reseller_price}"></div></div>
  <div style="display:flex;gap:8px"><button class="btn" onclick="saveP(${p.id})">সেভ</button><button class="btn2" onclick="togP(${p.id},${p.active})">${p.active?"বন্ধ করুন":"চালু করুন"}</button><button class="btn2 red" onclick="delP(${p.id})">ডিলিট</button></div></div>`).join("");
 if(S.tab==="users")h=!d.users.length?`<p class="c m">এখনো কোনো রিসেলার নেই</p>`:d.users.map(u=>`<div class="card row"><div style="display:flex;gap:10px;align-items:center">${avh(u.avatar_url,u.name,44)}<div><b>${esc(u.name)}</b><div class="m" style="font-size:13px">${esc(u.phone)} · ${esc(u.code)}</div></div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="${u.verified?"btn2":"btn"}" onclick="upd('profiles','${u.id}',{verified:${!u.verified}})">${u.verified?"ভেরিফাই বাতিল":"ভেরিফাই করুন"}</button><button class="btn2 sm" onclick="resetPw('${esc(u.phone)}')">পাসওয়ার্ড রিসেট</button></div></div>`).join("");
 const opt=(a,v)=>a.map(([k,l])=>`<option value="${k}" ${k===v?"selected":""}>${l}</option>`).join("");
 if(S.tab==="orders")h=d.orders.map(o=>`<div class="card"><div class="row"><b>#${o.id} · ${esc(o.profiles&&o.profiles.name)}</b><select style="width:auto;margin:0" onchange="upd('orders',${o.id},{status:this.value})">${opt([["pending","পেন্ডিং"],["confirmed","কনফার্মড"],["delivered","ডেলিভারড"],["cancelled","বাতিল"]],o.status)}</select></div>
  <div style="font-size:14px;margin-top:6px">${o.items.map(i=>esc(i.name)+" ×"+i.qty).join(", ")}</div><div class="m" style="font-size:13px">${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${esc(o.address)}</div><div style="font-size:14px">কাস্টমার থেকে ${tk(o.total)} (${o.delivery_area==="outside"?"ঢাকার বাইরে":"ঢাকার ভিতরে"} ডেলিভারি ${tk(o.delivery_charge)}) · রিসেলারের কমিশন ${tk(o.commission)}</div></div>`).join("");
 if(S.tab==="wds")h=d.wds.map(w=>`<div class="card row"><div><b>${esc(w.profiles&&w.profiles.name)}</b><div style="font-size:14px">${w.method==="nagad"?"নগদ":"বিকাশ"} ${esc(w.bkash)} · ${tk(w.amount)}</div></div><select style="width:auto;margin:0" onchange="upd('withdrawals',${w.id},{status:this.value})">${opt([["pending","পেন্ডিং"],["approved","অ্যাপ্রুভড"],["rejected","রিজেক্টেড"]],w.status)}</select></div>`).join("");
 return hdr("এডমিন প্যানেল")+tabsBar([["products","পণ্য"],["users","রিসেলার ("+d.users.length+")"],["orders","অর্ডার"],["wds","উত্তোলন"]])+`<main>${h}</main>`}

loadMe();
</script>
</body>
</html>
